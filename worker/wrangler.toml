name = "openthink3-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Bind to Workers AI
[ai]
binding = "AI"

# Bind to KV for memories and learning
[[kv_namespaces]]
binding = "MEMORIES"
id = "4239437890d8481abd708bd4bdf80890"

# Bind to KV for cloud-sync artifacts (worker bundles, manifests, deploy history).
[[kv_namespaces]]
binding = "ARTIFACTS"
id = "2b745f0f041b40279d8f013afee9ef5c"

# Bind to Durable Objects for Thread state
[[durable_objects.bindings]]
name = "THREAD_DO"
class_name = "ThreadDO"

[[durable_objects.bindings]]
name = "ORCHESTRATOR_DO"
class_name = "OrchestratorDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ThreadDO", "OrchestratorDO"]

# gbrain: relational store (pages, edges, signals, threads, benchmarks).
# Created with: npx wrangler d1 create openthink3-db
[[d1_databases]]
binding = "OPENTHINK3_DB"
database_name = "openthink3-db"
database_id = "afd1e794-f54d-4524-b9b0-10ba6500ee3e"

# gbrain: 384-dim BGE-small embeddings for semantic recall.
# Created with: npx wrangler vectorize create gbrain-pages --dimensions=384 --metric=cosine
[[vectorize]]
binding = "GBRAIN_PAGES"
index_name = "gbrain-pages"

# gbrain-dream (nightly memory consolidation) + gbrain-evals (eval suite).
# Cron expressions: 5am UTC = midnight EST, 6am UTC = 1am EST.
[triggers]
crons = ["0 5 * * *", "0 6 * * *"]

# Non-secret environment variables. Set with:
#   npx wrangler secret put CF_API_TOKEN
#   npx wrangler secret put GH_TOKEN
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put OAUTH_CLIENT_ID
# and via `npx wrangler deploy` env={...} for the vars below.
[vars]
CF_ACCOUNT_ID = ""
GH_REPO = "NeoFlux-Holdings/openthink3-minimax"
OAUTH_AUTHORIZE_URL = "https://dash.cloudflare.com/oauth2/auth"
OAUTH_TOKEN_URL = "https://dash.cloudflare.com/oauth2/token"
OAUTH_USERINFO_URL = "https://dash.cloudflare.com/oauth2/userinfo"
OAUTH_REVOKE_URL = "https://dash.cloudflare.com/oauth2/revoke"
# Default worker host (used to detect custom-domain requests that should require auth).
WORKER_DEFAULT_HOST = "openthink3-worker.thomas-zarebczan.workers.dev"
